# yaml-language-server: $schema=https://raw.githubusercontent.com/dimasma0305/gzcli/refs/heads/main/internal/template/templates/others/ctf-template/.gzctf/challenge.schema.yaml

name: "my imaginary dream"
author: "Dimas Maulana"

description: |
  A Go note-taking app lets you create, search, and view notes, while an admin bot stores the flag as a hidden note.

  Can you abuse the app's search and redirect behavior to leak the bot's secret note?

  URL: https://{{ .host }}

type: "StaticAttachment"
value: 1000

flags:
  - "FINDIT{134k_f0r_s3cr3t}"

provide: "./dist"

scripts:
    start: cd src && docker compose -p {{.slug}} up --build -d
    stop: cd src && docker compose -p {{.slug}} down --volumes
    restart:
        interval: 15m
        execute: cd src && docker compose -p {{.slug}} restart
