services:
  solve:
    build:
      context: .
      dockerfile: Dockerfile.solve
    restart: unless-stopped
    networks:
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.my_imaginary_dream_solver.rule=Host(`solve.1pc.tf`)"
      - "traefik.http.routers.my_imaginary_dream_solver.entrypoints=websecure"
      - "traefik.http.routers.my_imaginary_dream_solver.tls=true"
      - "traefik.http.routers.my_imaginary_dream_solver.tls.certresolver=letsencrypt"
      - "traefik.http.services.my_imaginary_dream_solver.loadbalancer.server.port=4444"

networks:
  traefik:
    external: true
