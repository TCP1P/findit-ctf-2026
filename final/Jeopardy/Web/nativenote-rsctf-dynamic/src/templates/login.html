{% extends "base.html" %}
{%- from "macros.html" import ransom -%}
{% block title %}Sign In — Phansite{% endblock %}
{% block content %}
<div class="auth-page">
<div class="torn-edge"></div>

<section class="auth-panel">
  <div class="auth-title">{{ ransom('welcome!', 'xl') }}</div>

  {% if error %}<p class="error">{{ error }}</p>{% endif %}

  <form method="POST" action="/login">
    <input type="text" name="username" placeholder="Username" required autofocus />
    <input type="password" name="password" placeholder="Password" required />
    <div class="actions">
      <button type="submit">Login</button>
    </div>
  </form>

  <p class="hint" style="margin-top:14px;">Forgot your password?</p>
  <p class="hint">Don't have an account? <a href="/register">Sign Up</a></p>
</section>

<div class="torn-edge bottom"></div>
</div>
{% endblock %}
